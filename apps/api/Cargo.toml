[package]
name = "caloryst-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
caloryst-application = { version = "0.1.0", path = "../../crates/caloryst-application" }
caloryst-domain = { version = "0.1.0", path = "../../crates/caloryst-domain" }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "rust_decimal", "time"] }
time = "0.3.55"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "signal", "net"] }
tower-http = { version = "0.7.1", features = ["fs", "trace", "timeout", "limit", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.28.0", features = ["serde", "v4"] }
